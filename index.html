<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>یک هدیه برای تو</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f8eee8;color:#462030;font-family:Tahoma,Arial,sans-serif}.card{width:min(92vw,34rem);padding:2.2rem 1.6rem;text-align:center;background:#fffaf7;border:1px solid #ead3c6;border-radius:1.7rem;box-shadow:0 1.4rem 4rem #4620301a}.heart{font-size:2rem;color:#a4445b;animation:pulse 1.2s ease-in-out infinite}.status{margin:.9rem 0 0;line-height:2}.hint{margin:.7rem 0 0;color:#7c6670;font-size:.82rem;line-height:1.8}.error{color:#8f2940}@keyframes pulse{50%{transform:scale(1.16)}}@media(prefers-reduced-motion:reduce){.heart{animation:none}}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="heart" aria-hidden="true">♥</div>
    <p class="status" id="status">هدیه‌ات داره باز می‌شه…</p>
    <p class="hint" id="hint">فقط یک لحظه صبر کن.</p>
  </main>
  <script>
    (() => {
      const status = document.getElementById("status");
      const hint = document.getElementById("hint");
      const fail = (message, detail) => {
        status.className = "status error";
        status.textContent = message;
        hint.textContent = detail;
      };
      const decodeKey = (value) => {
        const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
        return Uint8Array.from(atob(padded), (character) => character.charCodeAt(0));
      };
      const openGift = async () => {
        const storageName = "gift-link-key:" + location.pathname;
        const hashValue = location.hash.slice(1).trim();
        let encodedKey = hashValue;
        let keyBytes;
        try {
          keyBytes = decodeKey(encodedKey);
        } catch {
          keyBytes = new Uint8Array();
        }
        if (keyBytes.length !== 32) {
          encodedKey = sessionStorage.getItem(storageName) || "";
          try {
            keyBytes = decodeKey(encodedKey);
          } catch {
            keyBytes = new Uint8Array();
          }
        }
        if (!encodedKey) {
          fail("این لینک کامل نیست.", "لینک را دوباره و به‌صورت کامل از فرستنده بگیر.");
          return;
        }
        if (keyBytes.length !== 32) {
          fail("این لینک معتبر نیست.", "لینک کامل هدیه را باز کن.");
          return;
        }
        sessionStorage.setItem(storageName, encodedKey);
        try {
          const response = await fetch("gift.bin", { cache: "no-store" });
          if (!response.ok) throw new Error("payload");
          const payload = new Uint8Array(await response.arrayBuffer());
          if (payload.length < 30 || payload[0] !== 1) {
            throw new Error(`format:${payload.length}:${payload[0]}:${response.url}`);
          }
          const iv = payload.slice(1, 13);
          const ciphertext = payload.slice(13);
          const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv, tagLength: 128 }, key, ciphertext);
          const html = new TextDecoder().decode(plain);
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          console.error("Gift unlock failed", error);
          const detail = location.hostname === "127.0.0.1"
            ? String(error && (error.stack || error.message || error))
            : "احتمالاً بخشی از لینک حذف یا تغییر کرده؛ لینک کامل را دوباره باز کن.";
          fail("این هدیه با این لینک باز نشد.", detail);
        }
      };
      openGift();
    })();
  </script>
</body>
</html>
