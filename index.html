<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <link rel="preload" href="gift.bin?v=d0f2e5a6b56b" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="music.bin?v=8bea135b2e57" as="fetch" crossorigin="anonymous">
  <title>یک هدیه برای تو</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html{background:#170a13}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 72% 28%,#482033 0,transparent 42%),radial-gradient(circle at 18% 75%,#301424 0,transparent 38%),#170a13;color:#f8ece5;font-family:Tahoma,Arial,sans-serif}.loader{text-align:center;animation:appear .24s ease-out both}.mark{position:relative;font:italic 4.2rem Georgia,"Times New Roman",serif;letter-spacing:.12em;color:#e8afc0;line-height:1;text-shadow:0 0 48px #e8afc033}.mark span{position:absolute;right:-.2rem;bottom:-.2rem;font-size:1rem}.status{margin:1.15rem 0 0;color:#c5a8b4;font-size:.82rem;letter-spacing:.04em}.hint{margin:.65rem 0 0;color:#c5a8b4;font-size:.78rem;line-height:1.8}.error{color:#f0a6b8}.dot{display:inline-block;width:.28rem;height:.28rem;margin-right:.35rem;border-radius:50%;background:#e8afc0;animation:pulse .85s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.25;transform:scale(.65)}}@keyframes appear{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.loader,.dot{animation:none}}
  </style>
</head>
<body>
  <main class="loader" aria-live="polite">
    <div class="mark" aria-hidden="true">H<span>♥</span></div>
    <p class="status" id="status">برای تو<span class="dot" aria-hidden="true"></span></p>
    <p class="hint" id="hint"></p>
  </main>
  <script>
    (() => {
      const status = document.getElementById("status");
      const hint = document.getElementById("hint");
      const fail = (message, detail) => {
        status.className = "status error";
        status.textContent = message;
        hint.textContent = detail;
      };
      const decodeKey = (value) => {
        const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
        return Uint8Array.from(atob(padded), (character) => character.charCodeAt(0));
      };
      const openGift = async () => {
        const storageName = "gift-link-key:" + location.pathname;
        const hashValue = location.hash.slice(1).trim();
        let encodedKey = hashValue;
        let keyBytes;
        try {
          keyBytes = decodeKey(encodedKey);
        } catch {
          keyBytes = new Uint8Array();
        }
        if (keyBytes.length !== 32) {
          encodedKey = sessionStorage.getItem(storageName) || "";
          try {
            keyBytes = decodeKey(encodedKey);
          } catch {
            keyBytes = new Uint8Array();
          }
        }
        if (!encodedKey) {
          fail("این لینک کامل نیست.", "لینک را دوباره و به‌صورت کامل از فرستنده بگیر.");
          return;
        }
        if (keyBytes.length !== 32) {
          fail("این لینک معتبر نیست.", "لینک کامل هدیه را باز کن.");
          return;
        }
        sessionStorage.setItem(storageName, encodedKey);
        try {
          const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
          const response = await fetch("gift.bin?v=d0f2e5a6b56b");
          if (!response.ok) throw new Error("payload");
          const payload = new Uint8Array(await response.arrayBuffer());
          if (payload.length < 30 || (payload[0] !== 1 && payload[0] !== 2)) {
            throw new Error("format:" + payload.length + ":" + payload[0] + ":" + response.url);
          }
          const iv = payload.slice(1, 13);
          const ciphertext = payload.slice(13);
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv, tagLength: 128 }, key, ciphertext);
          let html;
          if (payload[0] === 2) {
            if (!("DecompressionStream" in window)) throw new Error("browser-too-old");
            const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
            html = await new Response(stream).text();
          } else {
            html = new TextDecoder().decode(plain);
          }
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          console.error("Gift unlock failed", error);
          const detail = location.hostname === "127.0.0.1"
            ? String(error && (error.stack || error.message || error))
            : "احتمالاً بخشی از لینک حذف یا تغییر کرده؛ لینک کامل را دوباره باز کن.";
          fail("این هدیه با این لینک باز نشد.", detail);
        }
      };
      openGift();
    })();
  </script>
</body>
</html>
